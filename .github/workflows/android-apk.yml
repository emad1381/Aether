name: android-apk

# Builds an installable Android APK of the Aether mobile app (Tauri v2).
# Produces a debug-signed APK that installs on a phone directly, with no
# Play Store setup or custom signing keys. Trigger from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Build Aether APK (arm64-v8a)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aether-mobile/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Build toolchain the core engine links against (BoringSSL via boring,
      # quiche). openjdk is needed by the Gradle step of the Android build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build nasm perl \
            openjdk-17-jdk

      - name: Install Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Speed up compilation: cache cargo dependencies and compiled target artifacts
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            aether-mobile/src-tauri
            aether

      # Cache Android Gradle dependencies to save 2-3 minutes
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK + cmdline-tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.2

      - name: Install tauri-cli and cargo-ndk (precompiled binaries, 5s)
        run: cargo binstall --no-confirm tauri-cli cargo-ndk

      - name: Generate the Android project
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo tauri android init --ci
          # Sign release builds with Android debug key so anyone can install without custom keystores
          GRADLE_KTS="gen/android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i '/getByName("release") {/a \        signingConfig = signingConfigs.getByName("debug")' "$GRADLE_KTS" || true
          fi

      # The app ships a real system-wide VPN, so the generated project needs the
      # Kotlin VpnService bridge, its manifest declarations and the runtime
      # permissions. Both are kept in aether-mobile/android/ and applied here.
      - name: Inject the Aether VPN service
        run: python3 ../android/patch_android.py gen/android

      - name: Build optimized release APK (under 25MB)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # Build release APK (uses [profile.release] with opt-level="z", LTO, and strip=true)
          cargo tauri android build --apk --target aarch64 || cargo tauri android build --apk --debug --target aarch64

      - name: Locate and verify APK size
        id: apk
        run: |
          set -euo pipefail
          APK="$(find "$GITHUB_WORKSPACE/aether-mobile/src-tauri/gen" -type f -name '*.apk' 2>/dev/null | head -n1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::no APK produced by the build"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Aether-Android.apk"
          SIZE_BYTES=$(stat -c%s "$GITHUB_WORKSPACE/Aether-Android.apk")
          SIZE_MB=$(( SIZE_BYTES / 1048576 ))
          echo "========================================="
          echo "  SUCCESS: Aether-Android.apk generated!"
          echo "  File Size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          echo "========================================="
          echo "path=$GITHUB_WORKSPACE/Aether-Android.apk" | tee "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: "v2.0.0"
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: false