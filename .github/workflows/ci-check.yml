name: ci-check

# Fast verification lane for the Windows desktop build only: type-checks the
# engine, runs the library tests, and builds the GUI that ships next to it.
# The full `release` workflow also builds macOS, Linux, musl, the Android APK
# and the Docker image, which is a lot of machinery for the question "does the
# Windows desktop still compile and do the unit tests still pass".
# Trigger: Actions tab -> ci-check -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "aether/src/**"
      - "aether/Cargo.toml"
      - "aether/Cargo.lock"
      - "aether-gui/**"
      - "quiche/quiche/**"
      - "quiche/octets/**"
      - ".github/workflows/ci-check.yml"
  pull_request:
    paths:
      - "aether/src/**"
      - "aether/Cargo.toml"
      - "aether/Cargo.lock"
      - "aether-gui/**"
      - "quiche/quiche/**"
      - "quiche/octets/**"
      - ".github/workflows/ci-check.yml"

permissions:
  contents: read

# One run at a time; a newer push cancels the queued older run.
concurrency:
  group: ci-check
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: cargo check + lib tests (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            aether
            aether-gui/src-tauri
          key: ci-check

      # BoringSSL (through `boring` and `quiche`) is built from source, so CMake
      # and NASM have to be on the runner before cargo is invoked.
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      # `--all-targets` covers the tests and benches as well as the library, so
      # a change that only breaks a test target still fails here. `--locked` is
      # left off deliberately: the lock file in the tree is out of step with the
      # manifest, so a pinned build would refuse to start before compiling
      # anything. It gets refreshed here and used by the later steps.
      - name: Type-check the engine
        working-directory: aether
        run: cargo check --all-targets

      - name: Run the library tests
        working-directory: aether
        run: cargo test --lib

      - name: Check formatting
        working-directory: aether
        run: cargo fmt --check

      - name: Lint the engine
        working-directory: aether
        run: cargo clippy --all-targets -- -D warnings

      # The GUI is what a Windows user actually runs, so it is built here too.
      # It ships the engine as a child process, so a change to the crate that
      # breaks the desktop app has to show up here rather than in a release.
      - name: Build the Windows GUI
        working-directory: aether-gui/src-tauri
        run: cargo build
