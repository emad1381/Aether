name: diagnose-tests

# Temporary: runs the library tests and republishes every failing test name as
# a check annotation. Annotations are readable from the public REST API, so the
# diagnosis does not need a signed-in session the way the raw logs do.
# Once the suite is green again this workflow can go.

on:
  workflow_dispatch:
  push:
    paths:
      - "aether/src/**"
      - ".github/workflows/diagnose-tests.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-tests
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  diagnose:
    name: find the failing tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            aether
            aether-gui/src-tauri
          key: diagnose-tests

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      # `--no-fail-fast` so one broken test does not hide the rest, and `|| true`
      # so the reporting step below always runs.
      - name: Run the library tests
        run: cargo test --lib --no-fail-fast 2>&1 | tee ../test-output.txt; exit 0

      - name: Report the failures and the tally as annotations
        shell: pwsh
        working-directory: .
        run: |
          $out = Get-Content test-output.txt -Raw
          $found = 0

          # The failure list cargo prints between `failures:` and the next blank
          # section names every test that did not pass, so that is the list worth
          # reading from the API.
          $inBlock = $false
          foreach ($line in ($out -split "`r?`n")) {
            if ($line -match '^\s*failures:\s*$') { $inBlock = $true; continue }
            if ($inBlock -and $line -match '^\s*test result:') { $inBlock = $false }
            if ($inBlock -and $line -match '^\s{4}\S') {
              $found++
              Write-Host "::error file=aether/src/socks.rs,title=Failing test::$($line.Trim())"
            }
          }

          # A panic outside a test body prints its message and source location
          # rather than a test name, so surface those too.
          foreach ($line in ($out -split "`r?`n")) {
            if ($line -match 'panicked at (.+)$') {
              $found++
              Write-Host "::error file=aether/src/lib.rs,title=Panic::$($Matches[1])"
            }
          }

          # A step can exit non-zero with no failing test at all: a doctest
          # failure, a linker message, a warning promoted by a config, or a
          # build script printing to stderr. Those are the lines that explain a
          # red run whose tally is clean, so report whatever is left over once
          # the test output itself has been accounted for. The line that follows
          # a diagnostic names the file and line it came from, so the source
          # location is carried along too.
          $lines = $out -split "`r?`n"
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i]
            if ($line -match '^\s*(error|warning)(\[|:)' -and
                $line -notmatch 'generated \d+ warning' -and
                $line -notmatch '^\s*error: aborting') {
              $where = ''
              for ($j = $i + 1; $j -lt [Math]::Min($i + 12, $lines.Count); $j++) {
                if ($lines[$j] -match '^\s*--> (.+)$') { $where = $Matches[1]; break }
                if ($lines[$j] -match '^\s*(Compiling|Running|Finished|error\[)') { break }
              }
              Write-Host "::warning file=aether/src/lib.rs,title=Cargo diagnostic::$($line.Trim()) at $where"
            }
            if ($line -match 'test result:') {
              Write-Host "::notice title=Test tally::$($line.Trim())"
            }
          }

          Write-Host "annotated $found failing test line(s)"
          exit 0

      # `cargo fmt --check` and `clippy` fail on style alone and print a diff or
      # a lint list, neither of which the test step above captures, so run each
      # one and name what it objects to. Colours are off so the output can be
      # matched, and neither step is allowed to fail the job: the annotations
      # are the point of this workflow.
      - name: Run fmt and clippy, capturing what each objects to
        shell: pwsh
        working-directory: aether
        run: |
          $env:CARGO_TERM_COLOR = "never"
          cargo fmt --check 2>&1 | Out-File -Encoding utf8 ../fmt-output.txt
          cargo clippy --all-targets -- -D warnings 2>&1 | Out-File -Encoding utf8 ../clippy-output.txt
          exit 0

      - name: Annotate what fmt and clippy objected to
        shell: pwsh
        working-directory: .
        run: |
          # rustfmt writes `Diff in <path> at line <n>:`, one block per hunk.
          $fmt = Get-Content fmt-output.txt -Raw
          $hunks = [regex]::Matches($fmt, 'Diff in ([^\r\n]+?) at line (\d+)')
          if ($hunks.Count -eq 0) {
            Write-Host "::notice title=Formatting::cargo fmt reported no file needing changes"
          }
          foreach ($h in $hunks) {
            $path = ($h.Groups[1].Value -replace '\\', '/')
            $line = $h.Groups[2].Value
            Write-Host "::error file=$path,title=Needs rustfmt::line $line"
          }

          # clippy, with -D warnings, reports each lint as
          # `warning: message` / `error: message` followed by `--> path:line:col`.
          $lint = Get-Content clippy-output.txt -Raw
          $lines = $lint -split "`r?`n"
          $count = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^(error|warning)(\[E\d+\])?: (.+)$') {
              $msg = $Matches[3]
              $where = $null
              for ($j = $i + 1; $j -lt [Math]::Min($i + 10, $lines.Count); $j++) {
                if ($lines[$j] -match '^\s*--> ([^:]+):(\d+):(\d+)') {
                  $where = @{ path = $Matches[1] -replace '\\', '/'; line = $Matches[2] }
                  break
                }
                if ($lines[$j] -match '^\s*(Checking|Compiling|Finished|error\[)') { break }
              }
              if ($msg -notmatch '^aborting due to' -and
                  $msg -notmatch '^\d+ warning' -and
                  $msg -notmatch 'generated \d+ warning') {
                $count++
                $file = if ($where) { $where.path } else { "aether/src/lib.rs" }
                $at = if ($where) { $where.line } else { "1" }
                Write-Host "::error file=$file,title=Clippy::$msg at line $at"
              }
            }
          }
          if ($count -eq 0) {
            Write-Host "::notice title=Clippy::clippy reported nothing"
          }
          exit 0

