name: gui-windows-fast

# Fast lane: builds ONLY the Windows x64 GUI + core engine.
# Use this for quick iteration instead of the full `release` matrix
# (which builds macOS, Linux, musl, Android and Docker).
# Trigger: Actions tab -> gui-windows-fast -> Run workflow.

on:
  workflow_dispatch:
  push:
    paths:
      - "aether/**"
      - "aether-gui/**"
      - "pt-build.sh"
      - "psiphon-build.sh"
      - ".github/workflows/gui-windows.yml"

permissions:
  contents: write

# Only one fast build runs at a time; a newer push cancels the older queued run.
concurrency:
  group: gui-windows-fast
  cancel-in-progress: true

jobs:
  gui-windows:
    name: Build Aether GUI (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Speed up Windows compilation by caching dependencies
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            aether
            aether-gui/src-tauri

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Build pluggable transports
        shell: bash
        run: bash ../pt-build.sh windows amd64 "$PWD/pt"

      - name: Build psiphon
        shell: bash
        run: bash ../psiphon-build.sh windows amd64 "$PWD/pt"

      - name: Build core engine (aether.exe)
        run: cargo build --release --features tor --target x86_64-pc-windows-msvc

      - name: Build Windows GUI (aether-gui.exe)
        shell: pwsh
        run: |
          cd "$env:GITHUB_WORKSPACE/aether-gui/src-tauri"
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Package archive
        shell: pwsh
        run: |
          $relDir = "target/x86_64-pc-windows-msvc/release"
          Copy-Item -Recurse -Force pt "$relDir/pt"
          Copy-Item "$env:GITHUB_WORKSPACE/aether-gui/src-tauri/target/x86_64-pc-windows-msvc/release/aether-gui.exe" "$relDir/"
          if (!(Test-Path "$relDir/pt/psiphon-tunnel-core.exe")) { throw "psiphon-tunnel-core.exe was not produced in pt" }
          if (!(Test-Path "$relDir/aether-gui.exe")) { throw "aether-gui.exe was not produced" }

          # Seed initial Cloudflare WARP/MASQUE identities for instant zero-config cold boot
          Write-Host "Provisioning initial Cloudflare identities..."
          Push-Location $relDir
          try {
              ./aether.exe --provision-all
          } catch {
              Write-Warning "Could not provision initial identities: $_"
          }
          # The native child resolves relative paths against the process working
          # directory, which Push-Location does not move, so harvest the identity
          # files from either location into the release folder.
          $relAbs = (Get-Location).Path
          $procCwd = [Environment]::CurrentDirectory
          foreach ($id in @('aether.toml','aether-secondary.toml','aether-masque.toml','aether-masque-secondary.toml')) {
              $dst = Join-Path $relAbs $id
              if (Test-Path $dst) { continue }
              foreach ($src in @((Join-Path $procCwd $id), (Join-Path (Get-Location).Path $id))) {
                  if ((Test-Path $src) -and ($src -ne $dst)) { Move-Item -Force $src $dst; break }
              }
          }

          # Seed initial Psiphon server list directly from Psiphon distribution channel.
          # The channel serves a zlib compressed signed JSON wrapper; the tunnel core
          # imports the raw hex entries inside it, so unwrap it here. Every path is
          # absolute: .NET file APIs resolve relative paths against the process working
          # directory (the workspace), not the Push-Location'd release folder — that
          # mismatch is what silently dropped the server list from the last release and
          # left the app unable to connect without a VPN. A zip without this file is
          # unusable offline, so a missing file fails the build instead of shipping.
          Write-Host "Seeding initial Psiphon server list..."
          $seedRoot = Join-Path $relAbs "aether.toml-psiphon\ca.psiphon.PsiphonTunnel.tunnel-core"
          New-Item -ItemType Directory -Force "$seedRoot\datastore", "$seedRoot\osl" | Out-Null
          $final = Join-Path $seedRoot "remote_server_list"
          $channel = "https://s3.amazonaws.com/psiphon/web/mjr4-p23r-puwl/server_list_compressed"
          try {
              $compressed = Join-Path $seedRoot "server_list_compressed"
              Invoke-WebRequest -Uri $channel -OutFile $compressed -UseBasicParsing -TimeoutSec 60
              $raw = [System.IO.File]::ReadAllBytes($compressed)
              if ($raw.Length -gt 2 -and $raw[0] -eq 0x78 -and $raw[1] -eq 0x9C) {
                  $ms = New-Object System.IO.MemoryStream(,$raw)
                  $decoder = New-Object System.IO.Compression.ZLibStream($ms, [System.IO.Compression.CompressionMode]::Decompress)
                  $reader = New-Object System.IO.StreamReader($decoder)
                  $wrapper = $reader.ReadToEnd() | ConvertFrom-Json
                  if ($wrapper.data) {
                      [System.IO.File]::WriteAllText($final, $wrapper.data)
                      Write-Host "Seeded Psiphon server entries ($((($wrapper.data -split "`n").Count)) lines)"
                  }
              }
              if (Test-Path $final) {
                  Remove-Item $compressed -ErrorAction SilentlyContinue
              } else {
                  # psiphon reads the signed wrapper natively from its datastore
                  # path, so shipping it raw still boots offline.
                  Move-Item -Force $compressed $final
              }
          } catch {
              Write-Warning "Psiphon seed unwrap failed: $_"
              try {
                  Invoke-WebRequest -Uri $channel -OutFile $final -UseBasicParsing -TimeoutSec 60
              } catch {
                  Write-Warning "Psiphon channel fallback failed: $_"
              }
          }
          if (!(Test-Path $final)) {
              throw "Psiphon server list seed failed: $final is missing; refusing to ship a zip that cannot connect offline"
          }
          Pop-Location

          $filesToZip = @(
              "$relDir/aether-gui.exe",
              "$relDir/aether.exe",
              "$relDir/pt",
              "run-aether.bat"
          )
          $optional = @(
              "$relDir/aether.toml",
              "$relDir/aether-secondary.toml",
              "$relDir/aether-masque.toml",
              "$relDir/aether-masque-secondary.toml",
              "$relDir/aether.toml-psiphon"
          )
          foreach ($opt in $optional) {
              if (Test-Path $opt) {
                  $filesToZip += $opt
              }
          }
          Compress-Archive -Path $filesToZip -DestinationPath aether-windows-x86_64-gui.zip -Force
          Get-ChildItem aether-windows-x86_64-gui.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows-x86_64-gui
          path: aether/aether-windows-x86_64-gui.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: "v2.1.7"
          files: aether/aether-windows-x86_64-gui.zip
          fail_on_unmatched_files: false
